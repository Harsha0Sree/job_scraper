  <meta name="description" content="ABOUT BASE

Base is America’s next-generation power company. We’re rebuilding the foundation of modern civilization–electricity–by deploying a vast network of distributed batteries that is transforming today’s fragile, centralized grid into a resilient and abundant system. We are engineers, operators, and creatives solving some of the most complex, interdisciplinary challenges of our time.


ABOUT THE ROLE

Our marketing team combines creative, customer-focused strategy with data-driven precision to reach the right customers at the right time. We’re hiring a Growth Marketer to drive Base’s customer acquisition engine as we expand into new markets across the country.

You’ll own acquisition targets and the channel mix that hits them: planning, executing, and optimizing campaigns across offline and digital channels. You’ll bring strong creative instincts and analytical rigor to everything from audience segmentation to vendor management to testing frameworks, and help build the systems and playbooks that make Base the first truly beloved energy company.

 


WHAT YOU&#39;LL DO

 - Own customer acquisition targets across growth channels, with clear accountability for cost-per-acquisition, response rates, and downstream conversion.

 - Build and manage acquisition campaigns across offline and digital channels, from creative development and audience targeting to vendor management and production.

 - Design and run rigorous tests (formats, messaging, offers, targeting) and use results to continuously improve performance across channels.

 - Collaborate closely with design to develop compelling campaign creative that stands out in every medium.

 - Translate performance data into decisions: prioritizing what to double down on, what to fix, and what to shut down.

 - Work cross-functionally with design, sales, and product to ensure direct mail and broader growth efforts align with market expansion plans.

 


WHAT YOU&#39;LL BRING

 - Growth marketing experience, with hands-on ownership of acquisition campaigns across offline and/or digital channels in a consumer or consumer-adjacent business.

 - Strong understanding of campaign operations: production workflows, vendor management, list sourcing and segmentation, A/B testing at scale.

 - Creative instincts. You care about what the customer actually sees, not just the data behind it.

 - Data fluency, with the ability to connect campaign performance to on-site behavior and CRM outcomes.

 - Experience working cross-functionally with design, sales, and product, translating growth goals into clear execution.

 


ABOUT THE TEAM

The Marketing team at Base is lean, high-ownership, and results-driven. We operate with clear accountability, tight feedback loops, and a strong bias towards action. Marketing works closely with design, sales, and product to build scalable systems that support the rapid buildout of America’s next-generation power company.

Please note: Base is a startup, which means priorities shift and evolve quickly. Your role may expand or change based on the needs of the business at any given time, so the responsibilities listed may not be exhaustive.


OUR VALUES

 - First Principles Thinking: Question assumptions. Principles &gt; rules.

 - Operate at Base Pace: Focus on what matters, act quickly, and learn by doing.

 - Give &amp; Get Feedback: Be direct, be humble, and maintain a growth mindset.

 - Everyone’s an Owner: Follow through on commitments and own results.

 - Strong Opinions, Loosely Held: Drive clarity and make calls with imperfect information.

 - Committed to the Mission: Rebuilding the grid is a big challenge. We work hard because we care deeply about the impact we’re creating. We work in-person. It’s not a 9-to-5. We are all-in.

 - Fun &amp; Optimism Coexist with Grit: Collaboration and celebration coincide with the intensity of building real things.


DO THE BEST WORK OF YOUR LIFE AT BASE." />

as we expand into new markets across the country.</p><p style=\"min-height:1.5em\">You’ll own acquisition targets and the channel mix that hits them: planning, executing, and optimizing campaigns across offline and digital channels. You’ll bring strong creative instincts and analytical rigor to everything from audience segmentation to vendor management to testing frameworks, and help build the systems and playbooks that make Base the first truly beloved energy company.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>What You'll Do</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Own customer acquisition targets across growth channels, with clear accountability for cost-per-acquisition, response rates, and downstream conversion.</p></li><li><p style=\"min-height:1.5em\">Build and manage acquisition campaigns across offline and digital channels, from creative development and audience targeting to vendor management and production.</p></li><li><p style=\"min-height:1.5em\">Design and run rigorous tests (formats, messaging, offers, targeting) and use results to continuously improve performance across channels.</p></li><li><p style=\"min-height:1.5em\">Collaborate closely with design to develop compelling campaign creative that stands out in every medium.</p></li><li><p style=\"min-height:1.5em\">Translate performance data into decisions: prioritizing what to double down on, what to fix, and what to shut down.</p></li><li><p style=\"min-height:1.5em\">Work cross-functionally with design, sales, and product to ensure direct mail and broader growth efforts align with market expansion plans.</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>What You'll Bring</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Growth marketing experience, with hands-on ownership of acquisition campaigns across offline and/or digital channels in a consumer or consumer-adjacent business.</p></li><li><p style=\"min-height:1.5em\">Strong understanding of campaign operations: production workflows, vendor management, list sourcing and segmentation, A/B testing at scale.</p></li><li><p style=\"min-height:1.5em\">Creative instincts. You care about what the customer actually sees, not just the data behind it.</p></li><li><p style=\"min-height:1.5em\">Data fluency, with the ability to connect campaign performance to on-site behavior and CRM outcomes.</p></li><li><p style=\"min-height:1.5em\">Experience working cross-functionally with design, sales, and product, translating growth goals into clear execution.</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>About the Team</strong></h2><p style=\"min-height:1.5em\">The Marketing team at Base is lean, high-ownership, and results-driven. We operate with clear accountability, tight feedback loops, and a strong bias towards action. Marketing works closely with design, sales, and product to build scalable systems that support the rapid buildout of America’s next-generation power company.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>Please note: Base is a startup, which means priorities shift and evolve quickly. Your role may expand or change based on the needs of the business at any given time, so the responsibilities listed may not be exhaustive.</em></p><p style=\"min-height:1.5em\"></p><h2><strong>Our Values</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>First Principles Thinking:</strong> Question assumptions. Principles &gt; rules.</p></li><li><p style=\"min-height:1.5em\"><strong>Operate at Base Pace:</strong> Focus on what matters, act quickly, and learn by doing.</p></li><li><p style=\"min-height:1.5em\"><strong>Give &amp; Get Feedback:</strong> Be direct, be humble, and maintain a growth mindset.</p></li><li><p style=\"min-height:1.5em\"><strong>Everyone’s an Owner:</strong> Follow through on commitments and own results.</p></li><li><p style=\"min-height:1.5em\"><strong>Strong Opinions, Loosely Held:</strong> Drive clarity and make calls with imperfect information.</p></li><li><p style=\"min-height:1.5em\"><strong>Committed to the Mission:</strong> Rebuilding the grid is a big challenge. We work hard because we care deeply about the impact we’re creating. We work in-person. It’s not a 9-to-5. We are all-in.</p></li><li><p style=\"min-height:1.5em\"><strong>Fun &amp; Optimism Coexist with Grit:</strong> Collaboration and celebration coincide with the intensity of building real things.</p><p style=\"min-height:1.5em\"></p></li></ul><h2><strong>Do the best work of your life at Base.</strong></h2>","secondaryLocationNames":[],"teamNames":["Growth","Marketing"],"compensationTierSummary":null,"compensationTiers":[],"applicationDeadline":null,"compensationTierGuideUrl":null,"scrapeableCompensationSalarySummary":null,"compensationPhilosophyHtml":null,"shouldAskForTextingConsent":true,"shouldAskForWhatsAppConsent":false,"candidateTextingPrivacyPolicyUrl":"https://www.basepowercompany.com/privacy-policy","candidateTextingTermsAndConditionsUrl":null,"legalEntityNameForTextingConsent":"Base Power Inc."},"jobBoard":null,"routerPrefix":"/","recaptchaPublicSiteKey":"6LeFb_YUAAAAALUD5h-BiQEp8JaFChe0e0A6r49Y"};
